@for(filter of filters; track $index) {
  <button
    
    class="px-3 py-1 text-sm rounded-full border transition-all duration-200 hover:bg-gray-100 hover:shadow-sm"
    [class.bg-gray-200]="selectedFilter === filter.value"
    (click)="setFilter(filter.value)"
  >
    {{ filter.label }}
  </button>
}
</div>
